[project]
name = "py-common"
version = "0.0.1"
description = "personalized-reco Python 공유 유틸 (DB·설정·지표)"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_common"]

# py_common 은 공유 계약(이벤트·설정·지표)이라 배치 쪽을 알면 안 된다.
# 의존 방향이 한 번 뒤집히면 순환이 생기고, 계약을 배치 사정에 맞춰 고치게 된다.
[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pipelines".msg = "의존 방향은 pipelines → py_common 한 방향이다. py_common 은 배치를 모른다."

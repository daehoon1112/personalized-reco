spring:
  application:
    name: personalized-reco-bronze-sink
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reco}
    username: ${DB_USER:reco}
    password: ${DB_PASSWORD:reco}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: bronze-sink
      auto-offset-reset: earliest
      enable-auto-commit: false # 오프셋 커밋은 리스너 정상 리턴 후(ack-mode: record)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record # 1건 처리(INSERT 커밋) 완료 후 오프셋 커밋 → at-least-once

app:
  kafka:
    events-topic: events
